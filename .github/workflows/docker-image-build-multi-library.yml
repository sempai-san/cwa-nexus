name: Build & Push - feature/multi-library

on:
  push:
    branches:
      - feature/multi-library
    paths:
      - 'cps/**'
      - 'scripts/**'
      - 'root/**'
      - 'empty_library/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'optional-requirements.txt'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set repo name to lowercase
        run: echo "LOWER_REPO_NAME=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.LOWER_REPO_NAME }}:multi-library
            ghcr.io/${{ github.repository_owner }}/${{ env.LOWER_REPO_NAME }}:multi-library-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VERSION=multi-library-${{ github.sha }}

      - name: Image digest
        run: echo "Image pushed to ghcr.io/${{ github.repository_owner }}/${{ env.LOWER_REPO_NAME }}:multi-library"
